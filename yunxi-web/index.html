<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 空 favicon：避免浏览器默认请求 /favicon.ico 产生 404 噪音（见后端 Bug 14 教训） -->
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云洗助手</title>
    <!-- Bootstrap 5.3.3 CDN（staticfile 国内镜像）。
         2026-09-19 真机点测：约 60 次页面加载里撞到 1 次 ERR_CONNECTION_CLOSED，
         那一次整页**没有样式**（裸 HTML）。所以备用链挂上 onerror —— 备用 CDN 多寡
         不是重点，"第一次没拉下来就直接裸奔"才是：
         bootcdn（360）→ jsdelivr（https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/...） -->
    <link rel="stylesheet"
          href="https://cdn.staticfile.org/bootstrap/5.3.3/css/bootstrap.min.css"
          onerror="this.onerror=null;this.href='https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css'" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- Bootstrap 交互组件 JS（折叠/下拉等），暂未用到。
         备用链必须**新建元素**接上 —— script 一旦已启动，改 src 不会重新加载
         （link 改 href 会，script 不会；这里两种写法不一样，别照抄上一个） -->
    <script src="https://cdn.staticfile.org/bootstrap/5.3.3/js/bootstrap.bundle.min.js"
            onerror="var s=document.createElement('script');s.src='https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js';document.head.appendChild(s)"></script>
  </body>
</html>
